<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Luana Barbosa — Android, Kotlin Multiplatform">
<style>
  @keyframes sweep { 0% { transform: translateX(-90px); } 100% { transform: translateX(300px); } }
  @keyframes blink { 0%,48% { opacity:1; } 52%,100% { opacity:0; } }
  @keyframes breathe { 0%,100% { opacity:.30; } 50% { opacity:.65; } }
  .sweep  { animation: sweep 3.8s cubic-bezier(.45,0,.25,1) infinite; }
  .cursor { animation: blink 1.15s steps(1) infinite; }
  .halo   { animation: breathe 7s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) {
    .sweep, .cursor, .halo { animation: none; }
  }
</style>
<defs><linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3DDC84"/><stop offset="1" stop-color="#7C6BF0"/></linearGradient><linearGradient id="spark" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#3DDC84" stop-opacity=".55"/><stop offset="1" stop-color="#3DDC84" stop-opacity="0"/></radialGradient><clipPath id="rule"><rect x="74" y="150" width="300" height="4" rx="2"/></clipPath></defs>
<rect width="1200" height="220" fill="#0D1117"/>
<ellipse class="halo" cx="1050" cy="60" rx="330" ry="210" fill="url(#glow)"/>
<text x="72" y="118" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="60" font-weight="700" letter-spacing="3" fill="#E6EDF3">LUANA BARBOSA</text>
<rect x="74" y="150" width="300" height="4" rx="2" fill="#21262D"/>
<rect x="74" y="150" width="300" height="4" rx="2" fill="url(#acc)" opacity=".85"/>
<g clip-path="url(#rule)"><rect class="sweep" x="74" y="150" width="90" height="4" fill="url(#spark)"/></g>
<text x="74" y="190" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="21" letter-spacing="1.5" textLength="400" lengthAdjust="spacing" fill="#8B949E">Android · Kotlin Multiplatform</text>
<rect class="cursor" x="484" y="174" width="11" height="21" fill="url(#acc)"/>
</svg>