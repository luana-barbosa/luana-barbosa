  @keyframes eat2 { 0%,38.4% { opacity:1; transform:scale(1); } 41.4%,100% { opacity:0; transform:scale(.25); } }
  .f2 { transform-box: fill-box; transform-origin: 50% 50%; animation: eat2 6.0s linear infinite; }
  @keyframes eat3 { 0%,48.0% { opacity:1; transform:scale(1); } 51.0%,100% { opacity:0; transform:scale(.25); } }
  .f3 { transform-box: fill-box; transform-origin: 50% 50%; animation: eat3 6.0s linear infinite; }
  @keyframes eat4 { 0%,57.6% { opacity:1; transform:scale(1); } 60.6%,100% { opacity:0; transform:scale(.25); } }
  .f4 { transform-box: fill-box; transform-origin: 50% 50%; animation: eat4 6.0s linear infinite; }
  @keyframes eat5 { 0%,66.5% { opacity:1; transform:scale(1); } 69.5%,100% { opacity:0; transform:scale(.25); } }
  .f5 { transform-box: fill-box; transform-origin: 50% 50%; animation: eat5 6.0s linear infinite; }
  .s2 { animation: grow2 6.0s linear infinite; }
  @keyframes grow2 { 0%,19.2% { opacity:0; } 21.2%,100% { opacity:1; } }
  .s3 { animation: grow3 6.0s linear infinite; }
  @keyframes grow3 { 0%,28.8% { opacity:0; } 30.8%,100% { opacity:1; } }
  .s4 { animation: grow4 6.0s linear infinite; }
  @keyframes grow4 { 0%,38.4% { opacity:0; } 40.4%,100% { opacity:1; } }
  .s5 { animation: grow5 6.0s linear infinite; }
  @keyframes grow5 { 0%,48.0% { opacity:0; } 50.0%,100% { opacity:1; } }
  .s6 { animation: grow6 6.0s linear infinite; }
  @keyframes grow6 { 0%,57.6% { opacity:0; } 59.6%,100% { opacity:1; } }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
</style>

