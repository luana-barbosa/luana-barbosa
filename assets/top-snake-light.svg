<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="LUANA BARBOSA - Android · Kotlin Multiplatform">
<style>
  @keyframes run { 0% { transform: translateX(-70px); } 72% { transform: translateX(980px); } 100% { transform: translateX(980px); } }
  @keyframes uncover { 0% { transform: translateX(0); } 72% { transform: translateX(1010px); } 100% { transform: translateX(1010px); } }
  @keyframes wig { 0%,100% { transform: translateY(-3px); } 50% { transform: translateY(3px); } }
  .snake { animation: run 6.0s linear infinite; }
