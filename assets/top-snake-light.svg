  .f0 { transform-box: fill-box; transform-origin: 50% 50%; animation: eat0 6.0s linear infinite; }
  @keyframes eat1 { 0%,28.8% { opacity:1; transform:scale(1); } 31.8%,100% { opacity:0; transform:scale(.25); } }
